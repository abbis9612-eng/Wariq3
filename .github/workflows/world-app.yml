# «العالم» على التلفون (GW9): يبني التطبيق (app/) ويرفعه على GitHub Pages (PWA يشتغل بدون نت)، ويبني APK أندرويد بـ Capacitor.
# الـAPK ينزل من صفحة الـrun ← Artifacts ← wariq-world-apk. Pages يحتاج مرة وحدة: Settings ← Pages ← Source: GitHub Actions.
name: world-app
on:
  push:
    paths: ['prototypes/world/**', 'prototypes/grandwar/img/**', 'prototypes/grandwar/sounds/**', 'tools/app/**', 'mobile/**', '.github/workflows/world-app.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: world-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/app/build.mjs
      - uses: actions/upload-artifact@v4
        with: { name: wariq-world-web, path: app }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # إذا Pages مو مفعّل، الـAPK يكمل
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v4
        with: { name: wariq-world-web, path: app }
      - name: Capacitor android
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/* android/app/src/main/res/
          sed -i -E 's/<activity( |$)/<activity android:screenOrientation="portrait"\1/' android/app/src/main/AndroidManifest.xml
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk wariq-world.apk
      - uses: actions/upload-artifact@v4
        with: { name: wariq-world-apk, path: wariq-world.apk }
