<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// تجربة شرح فقط (I-058): نفس صور الأقمار فوق تضاريس حقيقية لمنطقة دزفول، ومنصة S-400 حقيقية، وصاروخ يطلع
import { Engine, Scene, Vector3, Color3, Color4, HemisphericLight, DirectionalLight, UniversalCamera, Mesh, VertexData, StandardMaterial, Texture, LoadAssetContainerAsync, TransformNode, MeshBuilder } from '@babylonjs/core';
import '@babylonjs/loaders/glTF';
const q = new URLSearchParams(location.search), shot = q.get('shot') || 'top';
const G = await (await fetch('/mock/data/grid.json')).json(), H = new Float32Array(await (await fetch('/mock/data/grid.f32')).arrayBuffer());
const EX = 1.3, e = new Engine(document.getElementById('c'), true, { preserveDrawingBuffer: true }), s = new Scene(e);
s.clearColor = new Color4(.62, .72, .82, 1); s.fogMode = Scene.FOGMODE_EXP2; s.fogDensity = 1.1e-5; s.fogColor = new Color3(.7, .74, .78);
const h = new HemisphericLight('h', new Vector3(0, 1, 0), s); h.intensity = .55; h.groundColor = new Color3(.3, .27, .24);
const sun = new DirectionalLight('d', new Vector3(-.5, -.75, .45), s); sun.intensity = 1.6; sun.diffuse = new Color3(1, .95, .85);
// الأرض: شبكة بارتفاعات حقيقية وعليها صورة القمر الصناعي
const N = G.N, M = G.M, pos = [], uv = [], idx = [];
for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) { pos.push(i / (N - 1) * G.W - G.W / 2, H[j * N + i] * EX, -(j / (M - 1) * G.H - G.H / 2)); uv.push(i / (N - 1), 1 - j / (M - 1)); }
for (let j = 0; j < M - 1; j++) for (let i = 0; i < N - 1; i++) { const a = j * N + i, b = a + 1, c = a + N, d = c + 1; idx.push(a, c, b, b, c, d); }
const vd = new VertexData(); vd.positions = pos; vd.indices = idx; vd.uvs = uv; const nr = []; VertexData.ComputeNormals(pos, idx, nr); vd.normals = nr;
const ground = new Mesh('g', s); vd.applyToMesh(ground); const gm = new StandardMaterial('gm', s); gm.diffuseTexture = new Texture('/mock/data/sat.jpg', s); gm.specularColor = new Color3(0, 0, 0); gm.emissiveColor = new Color3(.18, .17, .15); ground.material = gm;
const XY = (lon, lat) => { const u = (lon + 180) / 360, v = (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2; const x = (u - G.bs[0]) * G.mpu - G.W / 2, zz = -((v - G.bs[1]) * G.mpu - G.H / 2);
  return new Vector3(x, hAt(x, zz), zz); };
function hAt(x, zz) { const fi = (x + G.W / 2) / G.W * (N - 1), fj = -(zz - G.H / 2) / G.H * (M - 1), i = Math.floor(fi), j = Math.floor(fj), a = fi - i, b = fj - j; return (H[j * N + i] * (1 - a) * (1 - b) + H[j * N + i + 1] * a * (1 - b) + H[(j + 1) * N + i] * (1 - a) * b + H[(j + 1) * N + i + 1] * a * b) * EX; }
async function model(url, len) { const c = await LoadAssetContainerAsync(url, s); c.addAllToScene(); const r = new TransformNode('r', s); c.rootNodes.forEach(n => n.parent = r); const b = r.getHierarchyBoundingVectors(true), L = Math.max(b.max.x - b.min.x, b.max.z - b.min.z); r.scaling.scaleInPlace(len / L); return r; }
const site = XY(48.52, 32.33);   // موقع S-400 جنوب شرق دزفول
if (shot === 'eject' || shot === 'fire') { const R0 = 1500, n = 120, P = [], U = [], I = []; for (let j = 0; j <= n; j++) for (let i = 0; i <= n; i++) { const x = site.x - R0 + i / n * 2 * R0, z = site.z - R0 + j / n * 2 * R0; P.push(x, hAt(x, z) + .4, z); U.push(i / n * 30, j / n * 30); }
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const a = j * (n + 1) + i, b = a + 1, c = a + n + 1, d = c + 1; I.push(a, b, c, b, d, c); }
  const v2 = new VertexData(); v2.positions = P; v2.indices = I; v2.uvs = U; const n2 = []; VertexData.ComputeNormals(P, I, n2); v2.normals = n2; const patch = new Mesh('patch', s); v2.applyToMesh(patch);
  const pm = new StandardMaterial('pm', s); pm.diffuseTexture = new Texture('/@fs/home/user/Wariq3/prototypes/battle-classic/textures/dirt_aerial_02.webp', s); pm.specularColor = new Color3(0, 0, 0); pm.emissiveColor = new Color3(.15, .14, .12); pm.backFaceCulling = false; patch.material = pm; }
const l = await model('/@fs/home/user/Wariq3/prototypes/theater/models/s400.glb', 13); l.position = site.clone(); l.rotation.y = 2.3; { const bb = l.getHierarchyBoundingVectors(true); l.position.y += site.y - bb.min.y + .3; }
const jet = await model('/@fs/home/user/Wariq3/prototypes/battle3d/models/f16.glb', 15); jet.position = site.add(new Vector3(-6000, 3200, 9000)); jet.rotation.y = .9;
// الصاروخ: 7.5 م (أبعاد 48N6 تقريباً) — مصنوع بالكود للتجربة
const ms = new StandardMaterial('ms', s); ms.diffuseColor = new Color3(.92, .92, .88);
const body = MeshBuilder.CreateCylinder('b', { height: 7.5, diameter: .52 }, s); body.material = ms; const nose = MeshBuilder.CreateCylinder('n', { height: 1.2, diameterTop: 0, diameterBottom: .52 }, s); nose.parent = body; nose.position.y = 4.35; nose.material = ms;
const smoke = new StandardMaterial('sm', s); smoke.diffuseColor = new Color3(.95, .95, .93); smoke.emissiveColor = new Color3(.5, .5, .5); smoke.alpha = .55;
const fire = new StandardMaterial('fm', s); fire.emissiveColor = new Color3(1, .75, .35); fire.disableLighting = true;
const puff = (p, r, a = .55) => { const b = MeshBuilder.CreateSphere('p', { diameter: r * 2, segments: 8 }, s); b.position = p; const m2 = smoke.clone('x'); m2.alpha = a; b.material = m2; };
const top = site.add(new Vector3(0, 4, 0));
if (shot === 'eject') { body.position = top.add(new Vector3(0, 30, 0)); for (let i = 0; i < 16; i++) puff(top.add(new Vector3((Math.random() - .5) * 8, 1 + Math.random() * 9, (Math.random() - .5) * 8)), 2 + Math.random() * 3, .28); }
else { // بعد الاشتعال: مال ويلحق الطيارة، عمود دخان من المنصة
  const pts = []; for (let k = 0; k <= 40; k++) { const t = k / 40; pts.push(top.add(new Vector3(-t * t * 520, 30 + t * 380, t * t * 780))); }
  pts.forEach((p, k) => { for (let r = 0; r < 3; r++) puff(p.add(new Vector3((Math.random() - .5) * 3, (Math.random() - .5) * 3, (Math.random() - .5) * 3)), 2.5 + k * .45, .22); }); for (let i = 0; i < 14; i++) puff(top.add(new Vector3((Math.random() - .5) * 30, Math.random() * 12, (Math.random() - .5) * 30)), 5 + Math.random() * 6, .25); const end = pts[40]; body.position = end; body.lookAt(end.add(new Vector3(-520, 120, 780))); body.rotation.x += Math.PI / 2;
  const fl = MeshBuilder.CreateCylinder('f', { height: 9, diameterTop: 1.6, diameterBottom: 0 }, s); fl.material = fire; fl.parent = body; fl.position.y = -8.2; fl.rotation.x = Math.PI; }
if (shot !== 'eject' && shot !== 'fire') body.scaling.scaleInPlace(1);
// الكاميرات
const cam = new UniversalCamera('c', new Vector3(0, 0, 0), s); cam.maxZ = 400000; cam.minZ = 2; cam.fov = .8;
if (shot === 'top') { s.fogMode = Scene.FOGMODE_NONE; cam.position = new Vector3(0, 95000, 0); cam.setTarget(new Vector3(0, 0, .1)); cam.fov = .9; }
else if (shot === 'tilt') { cam.position = site.add(new Vector3(-9000, 14000, -26000)); cam.setTarget(site.add(new Vector3(0, 0, 9000))); }
else if (shot === 'eject') { cam.position = site.add(new Vector3(-38, 6, -58)); cam.setTarget(site.add(new Vector3(0, 18, 0))); cam.fov = .8; }
else { cam.position = site.add(new Vector3(-160, 12, -260)); cam.setTarget(site.add(new Vector3(-90, 150, 200))); cam.fov = .9; }
await s.whenReadyAsync(); let n = 0; e.runRenderLoop(() => { s.render(); if (++n === 8) window.done = true; });
</script>
