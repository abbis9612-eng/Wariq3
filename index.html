<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحرب العالمية الثالثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#1e241d;--panel:#283027;--panel2:#313b2f;--line:#3d4939;--ink:#ebe5d2;--dim:#a7a892;--brass:#d2ab33;--brass-ink:#1c1a10;--neg:#e2674d;--pos:#7fc08a;
--sea:#17242b;--land:#2b312c;--me:#d2ab33;--ally:#3f9c94;--foe:#c2452f;--warm:#6f8f5a;--cold:#8a5a4a;--neutral:#5d665c;--map-ink:#f3eedc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e2cd;--panel:#f6f1e2;--panel2:#ede6d1;--line:#cfc6ab;--ink:#22281e;--dim:#666a55;--brass:#8c6a05;--brass-ink:#fff8e2;--neg:#b23a22;--pos:#2f7a3d;
--sea:#b7cbd0;--land:#d7d0bb;--me:#b98e12;--ally:#2f8f86;--foe:#b8402b;--warm:#8fae78;--cold:#b98772;--neutral:#a9ab98;--map-ink:#1d2219;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9e2cd;--panel:#f6f1e2;--panel2:#ede6d1;--line:#cfc6ab;--ink:#22281e;--dim:#666a55;--brass:#8c6a05;--brass-ink:#fff8e2;--neg:#b23a22;--pos:#2f7a3d;
--sea:#b7cbd0;--land:#d7d0bb;--me:#b98e12;--ally:#2f8f86;--foe:#b8402b;--warm:#8fae78;--cold:#b98772;--neutral:#a9ab98;--map-ink:#1d2219;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,.stamp,.kpi b,.gauge b{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif}
h2{font-size:19px;font-weight:600;margin:22px 0 8px}
h3{font-size:14px;font-weight:600;color:var(--dim);margin:18px 2px 6px}
small{display:block;color:var(--dim);font-size:12px;line-height:1.45;font-weight:400}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.app{max-width:520px;margin:0 auto;height:100%;position:relative}
/* البداية */
#start{height:100%;overflow-y:auto;padding:0 16px 32px}
.hero{padding:44px 4px 18px;border-bottom:2px solid var(--brass);position:relative}
.hero h1{font-size:46px;line-height:1.12;font-weight:700;letter-spacing:0}
.hero p{color:var(--dim);margin-top:10px}
.stamp{display:inline-block;border:2px solid var(--foe);color:var(--foe);padding:1px 12px;font-size:14px;font-weight:600;transform:rotate(-3deg);margin-bottom:14px;border-radius:3px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cty{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;display:flex;align-items:center;gap:6px;min-height:42px;line-height:1.25}
.cty span{font-size:19px}.cty.big{font-size:16px;font-weight:600;flex-wrap:wrap;padding:12px}.cty.big span{font-size:28px}.cty.big small{flex-basis:100%}
.cty.on{border-color:var(--brass);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--brass)}
.brief{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;padding:10px 12px;background:var(--panel2);border-inline-start:3px solid var(--brass);font-size:13px}.brief b{flex-basis:100%;font-size:16px}
.fine{color:var(--dim);font-size:12px;margin-top:14px}
.segs{display:flex;gap:6px;margin:8px 0}
.seg{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 6px;text-align:center;font-size:13.5px;min-height:42px}
.seg.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600}.seg.on small{color:inherit;opacity:.8}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 14px;font-weight:600;text-align:center;min-height:40px}
.btn.sm{padding:6px 10px;font-size:13px;min-height:36px}
.btn.wide{display:block;width:100%;margin-top:12px;padding:13px}
.btn.go{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.danger{border-color:var(--foe);color:var(--neg)}
.btn.ghost{background:none;border-color:var(--brass);color:var(--brass)}
.btn:disabled,.tech:disabled{opacity:.45;cursor:default}
/* الإطار */
#game{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:8px;min-width:0}.who b{display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}.flag{font-size:30px;line-height:1}
.hud{display:flex;gap:12px;text-align:center}.hud em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);line-height:1.2}.hud b{font-size:14px}
.pips{color:var(--brass);letter-spacing:1px}.pips i{font-style:normal;color:var(--line)}
#view{flex:1;overflow-y:auto;padding:10px 12px 20px}
#next{margin:0 12px 8px;padding:12px;border-radius:6px;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:16px;text-align:center}
#next.blocked{background:var(--panel2);color:var(--neg);border:1px solid var(--foe)}
#nav{display:flex;background:var(--panel);border-top:1px solid var(--line)}
#nav button{flex:1;padding:9px 2px 10px;text-align:center;font-size:12.5px;color:var(--dim);position:relative;border-top:2px solid transparent}
#nav button.on{color:var(--brass);border-top-color:var(--brass);font-weight:600}
#nav button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:4px;inset-inline-end:14%;background:var(--foe);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:11px;line-height:17px}
.subs{display:flex;gap:4px;overflow-x:auto;margin:0 -12px 10px;padding:0 12px 6px;border-bottom:1px solid var(--line)}
.subs button{padding:6px 12px;border-radius:16px;white-space:nowrap;font-size:13.5px;color:var(--dim)}
.subs button.on{background:var(--ink);color:var(--bg);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.card.war,.card.buy{display:flex;align-items:center;justify-content:space-between;gap:10px}.card.war>div,.card.buy>div:first-child{min-width:0;flex:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.row:last-child{border:0}.row small{display:inline}
.row b{font-weight:600;text-align:end;white-space:nowrap}.row.total{border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin:4px 0;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 4px;text-align:center}.kpi b{display:block;font-size:19px;line-height:1.3;font-weight:600}.kpi span{font-size:11.5px;color:var(--dim)}
.hint{color:var(--dim);font-size:12.5px;margin:8px 2px}
.bar{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--brass)}.bar.bad i{background:var(--foe)}
.fac{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 0;border-bottom:1px dashed var(--line)}.fac:last-of-type{border:0}.fac .bar{grid-column:1/-1}
.gauge{display:flex;align-items:baseline;gap:10px}.gauge b{font-size:34px}
.tbl{padding:2px 12px}.tr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);width:100%;font-size:14px}.tr:last-child{border:0}
.tbl .tr.th,.tbl .tr:has(>span:nth-child(5)){grid-template-columns:1.5fr repeat(4,1fr);text-align:center;font-size:13px}.tr.th{color:var(--dim);font-size:11.5px}.tr.th span:first-child,.tr span:first-child{text-align:start}
.tr.rk{grid-template-columns:auto 1fr auto}.tr.rk:not(:has(.no)){grid-template-columns:1fr auto}.tr .no{color:var(--dim);width:22px;font-size:13px}.tr.me b{color:var(--brass)}
.gen{font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim);white-space:nowrap}.gen.g4{color:var(--ink);border-color:var(--dim)}.gen.g5{color:var(--brass);border-color:var(--brass)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}
.sl{display:block;padding:8px 0;border-bottom:1px dashed var(--line)}.sl span{display:flex;justify-content:space-between}.sl input{width:100%;accent-color:var(--brass);height:30px}
.tech{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}.tech:last-child{border:0}.tech .bar{grid-column:1/-1}.tech.on b{color:var(--brass)}
.lv{color:var(--brass);font-size:11px;letter-spacing:2px}.lv i{font-style:normal;color:var(--line)}
.steps{display:flex;gap:3px;margin-top:5px}.steps i{width:22px;height:4px;background:var(--line);border-radius:2px}.steps i.on{background:var(--brass)}.steps.red i.on{background:var(--foe)}
.issue{border-inline-start:3px solid var(--brass)}.issue p{color:var(--dim);font-size:13.5px;margin:4px 0 10px}.opts,.acts{display:flex;flex-wrap:wrap;gap:6px}.acts .btn{flex:1 1 46%}
.rep p{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.rep p:last-child{border:0}.rep p.warn{color:var(--neg);font-weight:600}.rep p.win{color:var(--brass);font-weight:600}
.chart{width:100%;height:70px;transform:scaleX(-1)}.chart polyline{fill:none;stroke:var(--brass);stroke-width:2}
/* خريطة */
.mapwrap{position:relative;margin:-10px -12px 8px;height:min(52vh,460px);border-bottom:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none}
.zoom{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px}.zoom button{width:38px;height:38px;border-radius:6px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:19px}
.legend{position:absolute;bottom:6px;inset-inline:8px;display:flex;flex-wrap:wrap;gap:3px 5px;font-size:11px;align-items:center;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:4px;width:fit-content}.legend i{width:10px;height:10px;border-radius:2px;margin-inline-start:6px}
/* أوراق */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}#sheet[hidden],#battle[hidden],[hidden]{display:none!important}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sbody{position:relative;width:100%;max-width:520px;max-height:88%;background:var(--bg);border-radius:14px 14px 0 0;border-top:2px solid var(--brass);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sx{position:absolute;top:8px;inset-inline-end:10px;width:36px;height:36px;font-size:20px;text-align:center;color:var(--dim);z-index:2}#sheet[data-lock="1"] .sx{display:none}
#sheetc{overflow-y:auto;padding:14px 14px 22px}
.shead{display:flex;gap:10px;align-items:center;padding-inline-end:40px;margin-bottom:10px}.shead h2{margin:0;font-size:20px}.shead .flag{font-size:40px}.shead small b{font-weight:600}
.relm{height:6px;border-radius:3px;background:linear-gradient(to left,var(--foe),var(--neutral),var(--pos));position:relative;margin:10px 0 2px;direction:ltr}.relm i{position:absolute;top:-4px;width:4px;height:14px;background:var(--ink);border-radius:2px;margin-inline-start:-2px}
.regpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.q{display:flex;gap:4px}
.fld{display:block;font-size:13px;color:var(--dim);margin-bottom:10px}.fld input,.fld select{display:block;width:100%;margin-top:4px;padding:9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:16px}
.sws{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}.sws input{position:absolute;opacity:0}.sws i{display:block;width:34px;height:34px;border-radius:6px;border:2px solid var(--line);font-style:normal;text-align:center;line-height:30px;font-size:19px}.sws input:checked+i{border-color:var(--ink);box-shadow:0 0 0 2px var(--brass)}.sws input:focus-visible+i{outline:2px solid var(--brass)}
.over{text-align:center;padding:10px 0}.over h2{font-size:21px;line-height:1.5}.over.win .stamp{border-color:var(--brass);color:var(--brass)}
#toast{position:fixed;bottom:150px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:.2s;z-index:40;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--foe);color:#fff}
/* معركة */
#battle{position:fixed;inset:0;z-index:30;background:#000;color:#f1ecda}
#bc{width:100%;height:100%;display:block}
.btop{position:absolute;top:env(safe-area-inset-top,0px);inset-inline:0;padding:8px 10px;background:linear-gradient(rgba(0,0,0,.72),transparent);pointer-events:none}
.bsides{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}.bsides>div{flex:1}.bsides>div:last-child{text-align:end}
.bbar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:3px;overflow:hidden}.bbar i{display:block;height:100%;background:#d2ab33;transition:width .4s}.bsides>div:last-child .bbar i{background:#c2452f;margin-inline-start:auto}
#bwhere{font-size:12px;opacity:.85;text-align:center;margin-top:4px}
#bphase{text-align:center;font:600 21px "Reem Kufi",sans-serif;margin-top:6px;text-shadow:0 1px 6px #000;min-height:32px}
.bctl{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline:10px;display:flex;gap:6px;justify-content:center}.bctl button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;min-height:40px}
#bend{position:absolute;inset-inline:16px;top:50%;transform:translateY(-50%);background:rgba(20,22,18,.93);border:2px solid #d2ab33;border-radius:8px;padding:18px;text-align:center;max-width:460px;margin:auto}#bend.lose{border-color:#c2452f}#bend h2{margin:4px 0}#bend p{font-size:14px;opacity:.9}#bend.win .stamp{border-color:#d2ab33;color:#d2ab33}#bend .btn.go{background:#d2ab33;color:#1c1a10;border-color:#d2ab33}
@media (prefers-reduced-motion:reduce){#toast,.bbar i{transition:none}}
</style>
</head>
<body>
<div class="app">
 <div id="start"></div>
 <div id="game" hidden>
  <header id="top"></header>
  <main id="view"></main>
  <button id="next" data-a="next">الشهر التالي</button>
  <nav id="nav"><button data-a="tab" data-t="map">الخريطة</button><button data-a="tab" data-t="state">الدولة</button><button data-a="tab" data-t="army">الجيش</button><button data-a="tab" data-t="world">العالم</button><button data-a="tab" data-t="report">التقرير</button></nav>
 </div>
</div>
<div id="sheet" hidden><div class="sbg" data-a="closeSheet"></div><div class="sbody"><button class="sx" data-a="closeSheet" aria-label="إغلاق">✕</button><div id="sheetc"></div></div></div>
<div id="battle" hidden><canvas id="bc"></canvas>
 <div class="btop"><div class="bsides"><div><span id="bna"></span><div class="bbar"><i id="bla"></i></div></div><div><span id="bnd"></span><div class="bbar"><i id="bld"></i></div></div></div><div id="bwhere"></div><div id="bphase"></div></div>
 <div id="bend" hidden></div>
 <div class="bctl"><button id="bmute" data-a="battleMute" aria-label="الصوت">🔊</button><button id="bspeed" data-a="battleSpeed">سرعة ×1</button><button data-a="battleSkip">تخطَّ للنتيجة</button></div>
</div>

 if(o.tactic==='siege'){lossMul=.6;gainMul=.6;wk=6;As*=1+(milRaw(A,'arty')+milRaw(A,'air'))/Math.max(1,milRaw(A))*.2}

function jet(side,x){S_.air.push({kind:'jet',x,y:side?-40:H+40,vx:R(-20,20),vy:(side?1:-1)*300*ppm*1.6,side,drop:false});snd('jet',x,H/2)}
function enemyOf(side){const l=S_.u.filter(x=>x.side!==side&&x.alive);return l.length?pick(l):null}
function fire(from,tx,ty,kind){const sp={shell:520,tank:1500,rocket:420,msl:650,atgm:300}[kind]*ppm,d=Math.hypot(tx-from.x,ty-from.y);
 S_.pr.push({x:from.x,y:from.y,sx:from.x,sy:from.y,tx,ty,t:0,dur:Math.max(.08,d/sp),kind});
 const a=Math.atan2(ty-from.y,tx-from.x);S_.flash.push({x:from.x+Math.cos(a)*8,y:from.y+Math.sin(a)*8,r:kind==='tank'||kind==='shell'?12:7,life:0});puff(from.x,from.y,'dust',kind==='shell'||kind==='rocket'?4:2,10);snd(kind==='rocket'||kind==='msl'||kind==='atgm'?'pop':'gun',from.x,from.y)}
function step(dt){const t=T,u=S_.u;
 S_.ev=S_.ev.filter(e=>{if(e.t<=t){e.f();return false}return true});
 const adv=res.win?1:.45;
 u.forEach(x=>{if(!x.alive)return;
  if(t>=x.die){x.alive=false;const sh=enemyOf(x.side);if(sh&&x.type!=='inf'){S_.pr.push({x:sh.x,y:sh.y,sx:sh.x,sy:sh.y,tx:x.x,ty:x.y,t:0,dur:.25,kind:'tank'})}explode(x.x,x.y,x.type==='inf'?1:2);x.burn=x.type==='inf'?0:R(8,20);return}
  x.cd-=dt;
  if(x.side===0){const go=x.type==='tank'?t>18:x.type==='inf'?t>24.5:false;if(go&&t<32){const lim=H*(x.type==='tank'?(.86-.5*adv):(.93-.62*adv));if(x.y>lim){const v=(x.type==='tank'?11:3.2)*ppm*3.2;x.y-=v*dt;x.moving=true;if(x.type==='tank'&&Math.random()<.3)puff(x.x,x.y+8,'dust',1,7)}else x.moving=false}}
  else if(!res.win&&t>27&&x.type==='tank'&&x.y<H*.4)x.y+=6*ppm*3*dt;
  if(x.cd<=0){const e=enemyOf(x.side);if(!e)return;const sc=()=>R(-1,1)*40*ppm*3;
   if(x.type==='arty'){if(t>4&&t<30){fire(x,e.x+sc()*2,e.y+sc()*2,'shell');x.cd=R(3,6)}else x.cd=1}
   else if(x.type==='mlrs'){if(t>5&&t<16){for(let i=0;i<6;i++)S_.ev.push({t:t+i*.18,f:()=>{const q=enemyOf(0);if(q)fire(x,q.x+sc()*3,q.y+sc()*3,'rocket')}});x.cd=7}else x.cd=1}
   else if(x.type==='tank'){if(t>17.5&&Math.hypot(e.x-x.x,e.y-x.y)<2200*ppm*1.4){x.a=Math.atan2(e.y-x.y,e.x-x.x);fire(x,e.x+sc()*.4,e.y+sc()*.4,'tank');x.cd=R(2.5,5)}else x.cd=.6}
   else if(x.type==='inf'){if(t>23&&Math.hypot(e.x-x.x,e.y-x.y)<1200*ppm*1.6){for(let i=0;i<4;i++)S_.ev.push({t:t+i*.09,f:()=>{snd('mg',x.x,x.y);S_.pr.push({x:x.x,y:x.y,sx:x.x,sy:x.y,tx:e.x+R(-12,12),ty:e.y+R(-12,12),t:0,dur:.12,kind:'mg'})}});x.cd=R(.8,2)}else x.cd=.7}
   else if(x.type==='ad'){const j=S_.air.find(z=>z.side!==x.side&&z.y>0&&z.y<H);if(j){fire(x,j.x+j.vx*.8,j.y+j.vy*.8,'msl');x.cd=4}else x.cd=.5}}});
 S_.heli.forEach(h=>{if(t<h.t0||!h.alive)return;h.rot+=dt*40;if(h.y>h.ty)h.y-=70*ppm*3*dt;else{h.x+=Math.sin(t+h.t0)*8*dt;h.cd-=dt;if(h.cd<=0&&t<31){const e=enemyOf(0);if(e){fire(h,e.x,e.y,'atgm');h.cd=R(2.5,4)}}}});
 S_.air=S_.air.filter(j=>{j.x+=j.vx*dt;j.y+=j.vy*dt;
  if(j.kind==='jet'&&!j.drop&&(j.side?j.y>H*.7:j.y<H*.3)){j.drop=true;for(let i=0;i<3;i++){const e=enemyOf(j.side);if(e)S_.ev.push({t:T+i*.2,f:()=>explode(e.x+R(-30,30),e.y+R(-30,30),3)})}}
  return j.y>-80&&j.y<H+80});
 S_.pr=S_.pr.filter(p=>{p.t+=dt;const k=p.t/p.dur;p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k;if(k>=1){if(p.kind==='mg')puff(p.tx,p.ty,'dust',1,3);else if(p.kind==='msl'){S_.flash.push({x:p.tx,y:p.ty,r:16,life:0});puff(p.tx,p.ty,'smoke',3,8)}else explode(p.tx,p.ty,p.kind==='shell'?2.4:p.kind==='rocket'?2:1.3);return false}
  if((p.kind==='rocket'||p.kind==='msl'||p.kind==='atgm')&&Math.random()<.7)S_.fx.push({x:p.x,y:p.y,vx:0,vy:0,life:0,max:.9,size:3,type:'smoke'});return true});
 u.forEach(x=>{if(x.burn>0){x.burn-=dt;if(Math.random()<.3)puff(x.x,x.y,'black',1,9);if(Math.random()<.2)puff(x.x,x.y,'fire',1,5)}});
 S_.fx=S_.fx.filter(f=>{f.life+=dt;f.x+=f.vx*dt+(f.type!=='spark'?6*dt:0);f.y+=f.vy*dt;f.vx*=.94;f.vy*=.94;if(f.type!=='spark'&&f.type!=='fire')f.size+=dt*(f.type==='screen'?5:8);return f.life<f.max});
 if(S_.fx.length>900)S_.fx.splice(0,S_.fx.length-900);
 S_.flash=S_.flash.filter(f=>(f.life+=dt)<.12);shake*=.86}
/* رسم */
const COL=[['#4f5d34','#3a4526','#2a3219'],['#b39a66','#8f7848','#5e4e2e']];
function drawUnit(x){const c=COL[x.side],s=Math.max(.75,ppm*9);g.save();g.translate(x.x,x.y);
 if(!x.alive){if(x.type==='inf'){g.restore();return}g.rotate(x.a+x.rot*.05);g.fillStyle='#1c1a17';g.fillRect(-7*s,-4*s,14*s,8*s);g.fillStyle='#2c2823';g.beginPath();g.arc(2*s,1*s,3*s,0,7);g.fill();g.restore();return}
 if(x.type==='inf'){g.fillStyle=c[2];for(let i=0;i<5;i++){g.beginPath();g.arc([-5,4,-1,6,-6][i]*s,[-3,-5,1,4,5][i]*s,1.5*s,0,7);g.fill()}g.restore();return}
 g.rotate(x.type==='tank'?(x.moving?(x.side?Math.PI/2:-Math.PI/2):x.a):x.a);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(-7*s+2,-4*s+3,14*s,8*s);
 if(x.type==='tank'){g.fillStyle=c[2];g.fillRect(-7*s,-4.4*s,14*s,8.8*s);g.fillStyle=c[0];g.fillRect(-6.4*s,-3.1*s,12.8*s,6.2*s);g.save();g.rotate(x.moving?x.a-(x.side?Math.PI/2:-Math.PI/2):0);g.fillStyle=c[1];g.beginPath();g.arc(-.5*s,0,2.9*s,0,7);g.fill();g.fillRect(0,-.55*s,9.5*s,1.1*s);g.restore()}
 else if(x.type==='arty'){g.fillStyle=c[1];g.fillRect(-4*s,-2.4*s,7*s,4.8*s);g.fillStyle=c[2];g.fillRect(0,-.5*s,9*s,1*s);g.fillRect(-7*s,-2.6*s,3.5*s,.8*s);g.fillRect(-7*s,1.8*s,3.5*s,.8*s)}
 else if(x.type==='mlrs'){g.fillStyle=c[1];g.fillRect(-7*s,-2.8*s,14*s,5.6*s);g.fillStyle=c[2];g.fillRect(-6*s,-2.3*s,8*s,4.6*s);g.fillStyle=c[0];g.fillRect(3.5*s,-2.2*s,3*s,4.4*s)}
 else if(x.type==='ad'){g.fillStyle=c[1];g.fillRect(-6*s,-2.6*s,12*s,5.2*s);g.fillStyle='#d8d4c8';for(let i=-1;i<=1;i++)g.fillRect(-3*s,i*1.5*s-.4*s,7*s,.8*s)}
 g.restore()}
function draw(){g.save();g.translate(R(-shake,shake),R(-shake,shake));g.drawImage(ground,0,0);g.drawImage(decal,0,0);
 S_.b.forEach(b=>{g.save();g.translate(b.x,b.y);g.rotate(b.r);if(b.dead){g.fillStyle='rgba(58,52,46,.9)';for(let i=0;i<5;i++)g.fillRect((i*7%5-2.5)*b.w*.2,(i*11%5-2.5)*b.h*.2,b.w*.4,b.h*.35)}else{g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-b.w/2+3,-b.h/2+4,b.w,b.h);g.fillStyle=b.c;g.fillRect(-b.w/2,-b.h/2,b.w,b.h);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(-b.w/2,0,b.w,b.h/2)}g.restore()});
 S_.u.forEach(drawUnit);
 S_.fx.forEach(f=>{const k=f.life/f.max;if(f.type==='fire'){g.fillStyle=`rgba(255,${Math.round(210-150*k)},40,${1-k})`}else if(f.type==='spark'){g.fillStyle=`rgba(255,230,150,${1-k})`}else if(f.type==='dust'){g.fillStyle=`rgba(170,150,115,${.42*(1-k)})`}else if(f.type==='black'){g.fillStyle=`rgba(30,28,26,${.5*(1-k)})`}else if(f.type==='screen'){g.fillStyle=`rgba(225,225,220,${.5*Math.min(1,k*6)*(1-k)})`}else g.fillStyle=`rgba(200,200,195,${.4*(1-k)})`;
  g.beginPath();g.arc(f.x,f.y,f.type==='spark'?1.4:f.size,0,7);g.fill()});
 S_.pr.forEach(p=>{const arc=p.kind==='shell'||p.kind==='rocket'?Math.sin(Math.min(1,p.t/p.dur)*Math.PI)*26:0;
  if(arc){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(p.x,p.y,2,0,7);g.fill()}
  g.strokeStyle=p.kind==='mg'?'rgba(255,230,120,.9)':p.kind==='tank'?'rgba(255,240,200,.95)':'#2a2622';g.lineWidth=p.kind==='mg'?1:2;const a=Math.atan2(p.ty-p.sy,p.tx-p.sx),L=p.kind==='tank'?16:p.kind==='mg'?8:5;g.beginPath();g.moveTo(p.x,p.y-arc);g.lineTo(p.x-Math.cos(a)*L,p.y-arc-Math.sin(a)*L);g.stroke()});
 S_.heli.forEach(h=>{if(T<h.t0)return;const s=Math.max(.8,ppm*9);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(h.x+10,h.y+14,7*s,3*s,-Math.PI/2,0,7);g.fill();g.fillStyle=COL[0][2];g.beginPath();g.ellipse(h.x,h.y,2.6*s,6.5*s,0,0,7);g.fill();g.fillRect(h.x-.6*s,h.y+5*s,1.2*s,8*s);
  g.strokeStyle='rgba(20,20,20,.5)';g.lineWidth=1.5;for(let i=0;i<2;i++){const a=h.rot+i*Math.PI/2;g.beginPath();g.moveTo(h.x-Math.cos(a)*9*s,h.y-Math.sin(a)*9*s);g.lineTo(h.x+Math.cos(a)*9*s,h.y+Math.sin(a)*9*s);g.stroke()}g.fillStyle='rgba(40,40,40,.12)';g.beginPath();g.arc(h.x,h.y,9*s,0,7);g.fill()});
 S_.air.forEach(j=>{const s=Math.max(.9,ppm*10),d=j.vy<0?-1:1;g.save();g.translate(j.x,j.y);
  if(j.kind==='jet'){g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.moveTo(26,30+d*11*s);g.lineTo(26-7*s,30-d*7*s);g.lineTo(26+7*s,30-d*7*s);g.fill();g.fillStyle=j.side?'#8d8a80':'#5d6a70';g.beginPath();g.moveTo(0,d*11*s);g.lineTo(-1.6*s,d*2*s);g.lineTo(-7.5*s,-d*5*s);g.lineTo(-1.5*s,-d*4*s);g.lineTo(-3*s,-d*8*s);g.lineTo(3*s,-d*8*s);g.lineTo(1.5*s,-d*4*s);g.lineTo(7.5*s,-d*5*s);g.lineTo(1.6*s,d*2*s);g.fill()}
  else{g.fillStyle='rgba(0,0,0,.2)';g.fillRect(8-8*s,12,16*s,1.6*s);g.fillStyle='#d9d6cc';g.fillRect(-8*s,-.8*s,16*s,1.6*s);g.fillRect(-.9*s,-4*s,1.8*s,9*s);g.fillRect(-2.5*s,4.4*s,5*s,1*s)}g.restore()});
 S_.flash.forEach(f=>{const gr=g.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);gr.addColorStop(0,'rgba(255,250,220,.95)');gr.addColorStop(.4,'rgba(255,190,80,.6)');gr.addColorStop(1,'rgba(255,150,40,0)');g.fillStyle=gr;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()});
 g.restore()}
function hud(){const ph=PH.filter(p=>p[0]<=T).pop();$('#bphase').textContent=ph[1];
 const pa=clamp((T-19)/12,0,1),pd=clamp((T-5)/26,0,1);$('#bla').style.width=(100-res.la*100*pa*2.2)+'%';$('#bld').style.width=(100-res.ld*100*pd*(res.win?1.6:1))+'%';
 if(T>=32&&!endShown){endShown=true;const e=$('#bend');e.hidden=false;e.className=res.win?'win':'lose';
  e.innerHTML=`<div class="stamp">${res.fell?'سقطت العاصمة':res.captured?'سيطرة كاملة':res.win?'نجحت العملية':'فشل الهجوم'}</div><h2>${res.rname}</h2><p>خسرت ${Math.round(res.la*100)}٪ من القوة المشاركة، والعدو خسر ${Math.round(res.ld*100)}٪ من مدافعيه. المدة ${res.wk} أسابيع.</p><button class="btn wide go" data-a="battleEnd">رجوع للقيادة</button>`}}
function loop(now){const dt=clamp((now-last)/1000,0,.05)*speed;last=now;T+=dt;step(dt);draw();hud();if(T<END+600)raf=requestAnimationFrame(loop)}
function play(r,done){res=r;cb=done;const el=$('#battle');el.hidden=false;cv=$('#bc');const dpr=Math.min(2,window.devicePixelRatio||1);W_=cv.clientWidth;H=cv.clientHeight;cv.width=W_*dpr;cv.height=H*dpr;g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 ppm=H/FIELD;T=0;endShown=false;speed=1;shake=0;$('#bend').hidden=true;$('#bspeed').textContent='سرعة ×1';
 $('#bna').textContent=C(r.a).f+' '+C(r.a).n;$('#bnd').textContent=(C(r.b).alive?C(r.b).f+' ':'')+C(r.b).n;$('#bwhere').textContent=r.rname+' — '+TERR[r.terr][0];
 makeGround(r.terr);setup();audio();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){cancelAnimationFrame(raf);$('#battle').hidden=true;if(cb){const f=cb;cb=null;f()}}
A.battleEnd=end;A.battleSkip=()=>{if(T<32){speed=1;T=31.9;S_.ev=[];S_.u.forEach(x=>{if(x.die<1e8){x.die=0}})}};
A.battleSpeed=()=>{speed=speed===1?3:1;$('#bspeed').textContent='سرعة ×'+speed};
A.battleMute=()=>{muted=!muted;$('#bmute').textContent=muted?'🔇':'🔊';if(muted&&ac)ac.suspend()};
return {play};
})();
